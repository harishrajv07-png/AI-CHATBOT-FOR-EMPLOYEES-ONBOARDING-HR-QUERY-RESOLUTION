<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}HR Assistant{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="app-shell">
  <nav class="sidebar">
    <div class="brand">HR<span>Assist</span></div>
    <a href="{{ url_for('chat_page') }}" class="nav-link">💬 Chat</a>
    <a href="{{ url_for('onboarding_page') }}" class="nav-link">✅ Onboarding</a>
    <a href="{{ url_for('history_page') }}" class="nav-link">🕘 History</a>
    {% if session.get('role') == 'hr_admin' %}
    <a href="{{ url_for('admin_page') }}" class="nav-link">🛠 HR Admin</a>
    {% endif %}
    <div class="spacer"></div>
    <div class="user-info">{{ name }}</div>
    <a href="{{ url_for('logout') }}" class="nav-link logout">Log out</a>
  </nav>
  <main class="content">
    {% block content %}{% endblock %}
  </main>
</div>
</body>
</html>
